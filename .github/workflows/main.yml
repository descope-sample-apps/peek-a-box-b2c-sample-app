name: E2E Tests

on: [push]

jobs:
  cypress-run:
    name: Cypress E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Cypress binary
        run: npm run cy:install

      - name: Build
        run: npm run build

      # The action's built-in wait-on aborts on the first refused connection
      # ("Socket closed before the connection was established"), so start the
      # server and poll it ourselves.
      - name: Start app
        env:
          NEXT_PUBLIC_DESCOPE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_DESCOPE_PROJECT_ID }}
        run: |
          npm run start &
          timeout 120 bash -c 'until curl -sf http://localhost:3000 >/dev/null; do sleep 2; done'

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          install: false
          browser: chrome

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
